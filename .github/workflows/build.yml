name: build-exe

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest -v
      - name: Install PyInstaller
        run: python -m pip install pyinstaller==6.11.1
      - name: Build exe
        run: python -m PyInstaller --onefile --console --name FileClassifier classifier.py
      - name: Package
        shell: pwsh
        run: |
          Copy-Item rules.json dist\rules.json
          Compress-Archive -Path dist\FileClassifier.exe, dist\rules.json -DestinationPath FileClassifier.zip
      - uses: actions/upload-artifact@v4
        with:
          name: FileClassifier
          path: FileClassifier.zip
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" FileClassifier.zip --title "${{ github.ref_name }}" --notes "Windows exe build"
